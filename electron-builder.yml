appId: com.johnkuhn.youtubemusicwrapper
productName: YouTube Music Wrapper
directories:
  buildResources: build
  output: release
files:
  - dist/**/*
  - build/icon.png
  - package.json
mac:
  category: public.app-category.music
  icon: build/icon.png
  sign: ./scripts/mac-ad-hoc-sign.cjs
  target:
    - dmg
    - zip
